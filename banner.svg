<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Thanushika Mohanraj — Development Studies, Public Policy, Climate and Governance">
<title>Thanushika Mohanraj — Development Studies, Public Policy, Climate and Governance</title>
<style>
  .draw { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 2.2s ease-out .2s both; }
  .drawS { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw 1.6s ease-out 1.1s both; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
<defs>
  <radialGradient id="glow" cx="50%" cy="45%" r="70%">
    <stop offset="0" stop-color="#7A2536"/><stop offset="1" stop-color="#4E1521"/>
  </radialGradient>
  <clipPath id="frame"><rect width="900" height="300"/></clipPath>
</defs>
<rect width="900" height="300" fill="url(#glow)"/>
<!-- slowly turning globe, very faint: a nod to international affairs -->
<g clip-path="url(#frame)" fill="none" stroke="#CDB07A" stroke-width="1.1" opacity="0.16">
  <g transform="translate(820 262)">
    <circle r="170"/>
    <ellipse rx="170" ry="40"/><ellipse rx="170" ry="95"/><ellipse rx="170" ry="140"/>
    <line x1="-170" x2="170"/>
    <ellipse ry="170" rx="170"><animate attributeName="rx" values="170;0;170" dur="24s" begin="-0s" repeatCount="indefinite"/></ellipse>
    <ellipse ry="170" rx="170"><animate attributeName="rx" values="170;0;170" dur="24s" begin="-6s" repeatCount="indefinite"/></ellipse>
    <ellipse ry="170" rx="170"><animate attributeName="rx" values="170;0;170" dur="24s" begin="-12s" repeatCount="indefinite"/></ellipse>
    <ellipse ry="170" rx="170"><animate attributeName="rx" values="170;0;170" dur="24s" begin="-18s" repeatCount="indefinite"/></ellipse>
  </g>
</g>
<g stroke="#B08D57" fill="none">
  <line class="draw" x1="40" y1="44" x2="860" y2="44" stroke-width="1.4"/>
  <line class="draw" x1="40" y1="49" x2="860" y2="49" stroke-width="0.6"/>
  <line class="draw" x1="40" y1="251" x2="860" y2="251" stroke-width="0.6"/>
  <line class="draw" x1="40" y1="256" x2="860" y2="256" stroke-width="1.4"/>
</g>
<text class="fade" x="450" y="32" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="12.5" letter-spacing="4.5" fill="#CDB07A">A RESEARCH PORTFOLIO</text>
<text class="fade" x="450" y="152" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="62" fill="#F7F1E3" letter-spacing="0.5">Thanushika Mohanraj</text>
<g class="fade2">
  <line class="drawS" x1="440" y1="180" x2="300" y2="180" stroke="#B08D57" stroke-width="1"/>
  <line class="drawS" x1="460" y1="180" x2="600" y2="180" stroke="#B08D57" stroke-width="1"/>
  <path d="M450,175 L455,180 L450,185 L445,180 Z" fill="#B08D57"/>
</g>
<text class="fade3" x="450" y="221" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="15" letter-spacing="3.6" fill="#CDB07A">DEVELOPMENT STUDIES  ·  PUBLIC POLICY  ·  CLIMATE &amp; GOVERNANCE</text>
<text class="fade3" x="450" y="282" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-style="italic" font-size="14" fill="#F7F1E3" opacity="0.75">on institutions, policy, and the societies they shape</text>
</svg>
